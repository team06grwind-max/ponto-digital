<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Registos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f1f5f9;
    padding: 30px 30px 30px 250px;
}

/* SIDEBAR - DESKTOP */
.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:220px;
    height:100vh;
    background:#0f172a;
    border-right:1px solid rgba(255,255,255,0.1);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    z-index: 1000;
}

.sidebar h2{
    color:white;
    text-align:center;
    padding:25px 10px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:1.2rem;
}

.sidebar .menu-links {
    display: flex;
    flex-direction: column;
}

.sidebar a{
    display:block;
    padding:15px 20px;
    color:white;
    text-decoration:none;
    transition:.3s;
}

.sidebar a:hover{
    background:#1e293b;
}

.active{
    background:#1e293b;
}

.btn-logout {
    background: transparent;
    border: none;
    color: #ef4444;
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    border-top: 1px solid rgba(255,255,255,0.1);
    -webkit-tap-highlight-color: transparent;
}

.btn-logout:hover {
    background: rgba(239, 68, 68, 0.1);
}

/* MAIN CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
    width: 100%;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#0f172a;
}

/* RESPONSIVIDADE DA TABELA */
.table-container {
    width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
    background: white;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width: 600px;
}

th{
    background:#0f172a;
    color:white;
    padding:15px;
    font-size: 0.95rem;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #e2e8f0;
    color: #334155;
    font-size: 0.95rem;
}

tr:hover{
    background:#f8fafc;
}

.sem-registos{
    text-align:center;
    margin-top:50px;
    color:#64748b;
    font-size:1.1rem;
    padding: 20px;
}

/* INTERFACE RESPONSIVA - TELEMÓVEL */
@media (max-width: 768px) {
    body {
        padding: 80px 15px 20px 15px;
    }

    .sidebar {
        width: 100%;
        height: 60px;
        flex-direction: row;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        align-items: center;
    }

    .sidebar h2 {
        display: none;
    }

    .sidebar .menu-links {
        flex-direction: row;
        height: 100%;
    }

    .sidebar a {
        padding: 0 15px;
        display: flex;
        align-items: center;
        height: 100%;
        font-size: 0.9rem;
    }

    .btn-logout {
        width: auto;
        height: 100%;
        padding: 0 15px;
        border-top: none;
        border-left: 1px solid rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        font-size: 0.9rem;
    }

    h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
    }
    
    td, th {
        padding: 12px 10px;
    }
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="menu-links">
        <h2>📋 Menu</h2>
        <a href="index.html">🏠 Ponto Digital</a>
        <a href="historico.html" class="active">📅 Histórico</a>
    </div>
    <button class="btn-logout" id="btnLogout">🚪 Sair</button>
</div>

<div class="container">
    <h1>📋 Histórico de Registos</h1>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Horas Trabalhadas</th>
                <th>Localização</th>
            </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <div class="sem-registos" id="vazio" style="display:none;">
        A verificar autenticação...
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    orderBy
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
import { 
    getAuth, 
    onAuthStateChanged, 
    signOut 
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
function doPost(e) {
  var params = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  
  // Apenda a linha já consolidada pelo histórico
  sheet.appendRow([
    params.colaborador, 
    params.data, 
    params.entrada, 
    params.saida, 
    "", // A fórmula na célula E2 calcula automaticamente
    params.localizacao
  ]);
  
  return ContentService.createTextOutput("Sucesso");
}

const firebaseConfig = {
    apiKey: "AIzaSyCBAOQPsVWqCmZ2YfDwEMfzbHpc3z4ua9A",
    authDomain: "picagem-de-ponto-899d2.firebaseapp.com",
    projectId: "picagem-de-ponto-899d2",
    storageBucket: "picagem-de-ponto-899d2.firebasestorage.app",
    messagingSenderId: "235653631354",
    appId: "1:235653631354:web:c4909c8832b32cbea65ac3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const corpoTabela = document.getElementById("corpoTabela");
const vazio = document.getElementById("vazio");

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    } else {
        vazio.style.display = "none";
        carregarHistorico(user.uid);
    }
});

document.getElementById("btnLogout").addEventListener("click", () => {
    signOut(auth).then(() => {
        window.location.href = "login.html";
    });
});

function arredondarHora(horaString) {
    if (!horaString || horaString === "-") return "-";
    let partes = horaString.split(':');
    let horas = Number(partes[0]);
    let minutos = partes[1] ? Number(partes[1]) : 0;
    
    let minutosTotais = horas * 60 + minutos;
    let minutosArredondados = Math.round(minutosTotais / 30) * 30;
    let novasHoras = Math.floor(minutosArredondados / 60) % 24;
    let novosMinutos = minutosArredondados % 60; 
    return `${String(novasHoras).padStart(2, '0')}:${String(novosMinutos).padStart(2, '0')}`;
}

function calcularDiferencaHoras(entrada, saida) {
    if (!entrada || entrada === "-" || !saida || saida === "-") return "-";
    const [hEntrada, mEntrada] = entrada.split(':').map(Number);
    const [hSaida, mSaida] = saida.split(':').map(Number);
    let totalMinutos = (hSaida * 60 + mSaida) - (hEntrada * 60 + mEntrada);
    if (totalMinutos < 0) return "-"; 
    const horas = Math.floor(totalMinutos / 60);
    const minutos = totalMinutos % 60;
    return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}h`;
}

function formatarLocalizacao(localizacao) {
    if (!localizacao) return "-";
    if (typeof localizacao === 'object' && ('latitude' in localizacao || 'lat' in localizacao)) {
        return "Registada"; 
    }
    return localizacao;
}

async function carregarHistorico(uid){
    try{
        const q = query(
            collection(db,"registos"),
            where("userId", "==", uid),
            orderBy("criadoEm","asc")
        );
        const snapshot = await getDocs(q);

        if(snapshot.empty){
            vazio.style.display = "block";
            vazio.innerHTML = "Nenhum registo encontrado.";
            corpoTabela.innerHTML = "";
            return;
        }

        const blocosPorData = {};

        snapshot.forEach((doc) => {
            const r = doc.data();
            const dataRegisto = r.data || "-";
            const tipo = r.tipo ? r.tipo.toLowerCase().trim() : "";
            const horaTratada = r.hora ? arredondarHora(r.hora) : "-";
            const localizacaoFormatada = formatarLocalizacao(r.localizacao);

            if (dataRegisto === "-") return;

            if (!blocosPorData[dataRegisto]) {
                blocosPorData[dataRegisto] = {
                    entrada: "-",
                    saida: "-",
                    localizacao: "-"
                };
            }

            if (tipo === "entrada") {
                blocosPorData[dataRegisto].entrada = horaTratada;
                if (blocosPorData[dataRegisto].localizacao === "-") {
                    blocosPorData[dataRegisto].localizacao = localizacaoFormatada;
                }
            } else if (tipo === "saída" || tipo === "saida") {
                blocosPorData[dataRegisto].saida = horaTratada;
                if (localizacaoFormatada !== "-") {
                    blocosPorData[dataRegisto].localizacao = localizacaoFormatada;
                }
            }
        });

        const datasOrdenadas = Object.keys(blocosPorData).sort((a, b) => {
            const [diaA, mesA, anoA] = a.split('/').map(Number);
            const [diaB, mesB, anoB] = b.split('/').map(Number);
            return new Date(anoB, mesB - 1, diaB) - new Date(anoA, mesA - 1, diaA);
        });

        corpoTabela.innerHTML = "";

        datasOrdenadas.forEach((dataKey) => {
            const bloco = blocosPorData[dataKey];
            const horasTrabalhadas = calcularDiferencaHoras(bloco.entrada, bloco.saida);

            corpaoTabela.innerHTML += `
                <tr>
                    <td>${dataKey}</td>
                    <td>${bloco.entrada}</td>
                    <td>${bloco.saida}</td>
                    <td>${horasTrabalhadas}</td>
                    <td>${bloco.localizacao}</td>
                </tr>
            `;
        });

    } catch(erro) {
        console.error("Erro detalhado do Firestore:", erro);
        vazio.style.display = "block";
        vazio.innerHTML = "❌ Erro ao carregar os registos. Verifique a consola.";
    }
}
</script>

</body>
</html>
