<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto Digital - Login Google</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding: 20px; /* Garante que o cartão não cole às bordas em telemóveis antigos */
}

.login-container{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px 30px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    text-align:center;
    transition: padding 0.3s ease;
}

.logo{
    font-size:2rem;
    font-weight:bold;
    color:#0f172a;
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    margin-bottom:35px;
    font-size:0.95rem;
    line-height: 1.4;
}

.btn-google {
    width:100%;
    border:1px solid #cbd5e1;
    padding:14px;
    font-size:1rem;
    border-radius:12px;
    cursor:pointer;
    background:white;
    color:#1e293b;
    font-weight:600;
    transition:0.2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.05);
    /* Remove o efeito de realce cinzento ao tocar no telemóvel */
    -webkit-tap-highlight-color: transparent; 
}

.btn-google:hover{
    background:#f8fafc;
    border-color:#94a3b8;
}

/* Efeito de clique físico otimizado para desktop e telemóvel */
.btn-google:active {
    transform: scale(0.98);
}

.error-msg{
    margin-top:20px;
    color:#ef4444;
    font-size:0.9rem;
    font-weight:500;
    display:none;
    line-height: 1.4;
    padding: 10px;
    background: #fef2f2;
    border-radius: 8px;
}

/* AJUSTES RESPONSIVOS PARA TELEMÓVEL */
@media (max-width: 480px) {
    .login-container {
        padding: 30px 20px; /* Otimiza o espaço interno em ecrãs pequenos */
        border-radius: 16px;
    }

    .logo {
        font-size: 1.75rem;
    }

    .subtitle {
        margin-bottom: 25px;
        font-size: 0.9rem;
    }

    .btn-google {
        padding: 16px; /* Aumenta a área de toque no telemóvel */
        font-size: 0.95rem;
    }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="logo">📋 Ponto Digital</div>
    <div class="subtitle">Aceda ao sistema utilizando a sua conta Google</div>

    <button id="btnGoogle" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.75H24v9h12.75c-.53 2.87-2.13 5.32-4.59 6.98l7.15 5.54C43.5 36.46 46.5 31 46.5 24z"/>
            <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
            <path fill="#34A853" d="M24 38.5c-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48c5.48 0 10.53-1.8 14.42-4.88l-7.15-5.54c-2.11 1.41-4.81 2.42-7.27 2.42z"/>
        </svg>
        Entrar com o Google
    </button>

    <div class="error-msg" id="errorMsg">❌ Falha na autenticação com o Google. Tente novamente.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCBAOQPsVWqCmZ2YfDwEMfzbHpc3z4ua9A",
    authDomain: "picagem-de-ponto-899d2.firebaseapp.com",
    projectId: "picagem-de-ponto-899d2",
    storageBucket: "picagem-de-ponto-899d2.firebasestorage.app",
    messagingSenderId: "235653631354",
    appId: "1:235653631354:web:c4909c8832b32cbea65ac3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// Redirecionamento automático caso já exista sessão ativa
onAuthStateChanged(auth, (user) => {
    if (user) {
        window.location.href = "index.html";
    }
});

document.getElementById("btnGoogle").addEventListener("click", async () => {
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.style.display = "none";

    try {
        await signInWithPopup(auth, provider);
        window.location.href = "index.html";
    } catch (error) {
        console.error("Erro na autenticação do Google:", error.message);
        errorMsg.style.display = "block";
    }
});
</script>

</body>
</html>
