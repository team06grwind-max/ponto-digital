<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Picagem de Ponto</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    /* Imagem de fundo configurada para cobrir todo o ecrã com uma opacidade escura suave */
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.85)), 
                url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIMYdNkebmtJhpfPonmW0AAyX5swsCLPYO-A&s');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    padding-left:220px;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:220px;
    height:100vh;
    background:#0f172a;
    border-right:1px solid rgba(255,255,255,0.1);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.sidebar h2{
    color:white;
    text-align:center;
    padding:25px 10px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.sidebar a{
    display:block;
    padding:15px 20px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.sidebar a:hover{
    background:#1e293b;
}

.active{
    background:#1e293b;
}

.btn-logout {
    background: transparent;
    border: none;
    color: #ef4444;
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    border-top: 1px solid rgba(255,255,255,0.1);
}

.btn-logout:hover {
    background: rgba(239, 68, 68, 0.1);
}

.container{
    width:90%;
    max-width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    text-align:center;
}

.logo{
    font-size:2rem;
    font-weight:bold;
    color:#0f172a;
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    margin-bottom:30px;
}

.clock{
    font-size:2.5rem;
    font-weight:bold;
    color:#1e293b;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
    justify-content:center;
}

.btn{
    border:none;
    padding:15px 30px;
    font-size:1rem;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
    font-weight:600;
}

.btn-entry{
    background:#22c55e;
    color:white;
}

.btn-entry:hover:not(:disabled){
    background:#16a34a;
    transform:translateY(-2px);
}

.btn-exit{
    background:#ef4444;
    color:white;
}

.btn-exit:hover:not(:disabled){
    background:#dc2626;
    transform:translateY(-2px);
}

.btn:disabled{
    background:#cbd5e1;
    color:#94a3b8;
    cursor:not-allowed;
    transform:none !important;
}

.location{
    margin-top:25px;
    padding:15px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:12px;
    color:#1e3a8a;
    font-size:.95rem;
}

.record{
    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:12px;
    color:#334155;
    font-weight:500;
}

.footer{
    margin-top:20px;
    color:#94a3b8;
    font-size:0.9rem;
}
</style>
</head>
<body>

<div class="sidebar">
    <div>
        <h2>📋 Menu</h2>
        <a href="index.html" class="active">🏠 Ponto Digital</a>
        <a href="historico.html">📅 Histórico</a>
    </div>
    <button class="btn-logout" id="btnLogout">🚪 Terminar Sessão</button>
</div>

<div class="container">
    <div class="logo">📋 Ponto Digital</div>
    <div class="subtitle">Sistema de Registo de Entradas e Saídas</div>

    <div class="clock" id="clock">00:00:00</div>

    <div class="buttons">
        <button class="btn btn-entry" id="btn-entrada" onclick="registrar('Entrada')">
            ✅ Entrada
        </button>

        <button class="btn btn-exit" id="btn-saida" onclick="registrar('Saída')">
            🚪 Saída
        </button>
    </div>

    <div class="location" id="location">📍 A obter localização...</div>
    <div class="record" id="record">A verificar autenticação...</div>

    <div class="footer">© 2026 Sistema de Picagem de Ponto</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  signOut 
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBAOQPsVWqCmZ2YfDwEMfzbHpc3z4ua9A",
  authDomain: "picagem-de-ponto-899d2.firebaseapp.com",
  projectId: "picagem-de-ponto-899d2",
  storageBucket: "picagem-de-ponto-899d2.firebasestorage.app",
  messagingSenderId: "235653631354",
  appId: "1:235653631354:web:c4909c8832b32cbea65ac3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let usuarioAtual = null;
let latitude = null;
let longitude = null;
let localizacaoTexto = "";

// --- FUNÇÕES DE TRATAMENTO DE HORAS ---

function arredondarHora(horaString) {
    if (!horaString || horaString === "-" || !horaString.includes(':')) return "-";
    let partes = horaString.split(':');
    let horas = Number(partes[0]);
    let minutos = partes[1] ? Number(partes[1]) : 0;
    
    let minutosTotais = horas * 60 + minutos;
    let minutosArredondados = Math.round(minutosTotais / 30) * 30;
    let novasHoras = Math.floor(minutosArredondados / 60) % 24;
    let novosMinutos = minutesArredondados % 60; 
    return `${String(novasHoras).padStart(2, '0')}:${String(novosMinutos).padStart(2, '0')}`;
}

function calcularDiferencaHoras(entrada, saida) {
    if (!entrada || entrada === "-" || !saida || saida === "-" || !entrada.includes(':') || !saida.includes(':')) return "-";
    const [hEntrada, mEntrada] = entrada.split(':').map(Number);
    const [hSaida, mSaida] = saida.split(':').map(Number);
    let totalMinutos = (hSaida * 60 + mSaida) - (hEntrada * 60 + mEntrada);
    if (totalMinutos < 0) return "-"; 
    const horas = Math.floor(totalMinutos / 60);
    const minutos = totalMinutos % 60;
    return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}h`;
}

async function enviarParaGoogleSheets(dadosRegisto) {
    const urlScript = "https://script.google.com/macros/s/AKfycbxm_v93NQagNCp0rrExyXp5ytjiu-CovYcGxKEU0VI7ObV0fRKGDxWEXywlYYHNhlik/exec";
    
    const horaSaidaArredondada = arredondarHora(dadosRegisto.horaSaida);
    const horaEntradaArredondada = arredondarHora(dadosRegisto.horaEntradaDoDia);
    const totalTrabalhado = calcularDiferencaHoras(horaEntradaArredondada, horaSaidaArredondada);

    const payload = {
        colaborador: dadosRegisto.userEmail ? dadosRegisto.userEmail.split('@')[0] : "Usuário",
        data: dadosRegisto.data,
        horaEntrada: horaEntradaArredondada,
        horaSaida: horaSaidaArredondada,
        horasTrabalhadas: totalTrabalhado,
        localizacao: dadosRegisto.localizacao
    };

    try {
        await fetch(urlScript, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    } catch (error) {
        console.error("Erro ao sincronizar com Sheets:", error);
    }
}

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    } else {
        usuarioAtual = user; 
        verificarBloqueios();
        obterLocalizacao();
    }
});

document.getElementById("btnLogout").addEventListener("click", () => {
    signOut(auth).then(() => {
        window.location.href = "login.html";
    });
});

function atualizarRelogio(){
    const agora = new Date();
    const horas = String(agora.getHours()).padStart(2,'0');
    const minutos = String(agora.getMinutes()).padStart(2,'0');
    const segundos = String(agora.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${horas}:${minutos}:${segundos}`;
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

function obterLocalizacao(){
    if(!navigator.geolocation){
        document.getElementById("location").innerHTML = "❌ O navegador não suporta geolocalização.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(posicao){
            latitude = posicao.coords.latitude;
            longitude = posicao.coords.longitude;

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
            .then(resposta => resposta.json())
            .then(dados => {
                const endereco = dados.address || {};
                const freguesia = endereco.suburb || endereco.city_district || endereco.neighbourhood;
                const cidade = endereco.city || endereco.town || endereco.village || endereco.municipality;
                const pais = endereco.country || "";

                localizacaoTexto = freguesia && cidade
                    ? `${freguesia}, ${cidade}, ${pais}`
                    : cidade ? `${cidade}, ${pais}`
                    : freguesia ? `${freguesia}, ${pais}`
                    : endereco.county ? `${endereco.county}, ${pais}`
                    : "Localização não encontrada";

                document.getElementById("location").innerHTML = `📍 ${localizacaoTexto}`;
            })
            .catch(() => {
                document.getElementById("location").innerHTML = "❌ Erro ao obter a localização.";
            });
        },
        function(){
            document.getElementById("location").innerHTML = "❌ Permissão de localização negada.";
        },
        { enableHighAccuracy:true }
    );
}

async function obterHoraEntradaDoDia() {
    if (!usuarioAtual) return "-";
    const hoje = new Date().toLocaleDateString('pt-PT');
    try {
        const q = query(
            collection(db, "registos"), 
            where("userId", "==", usuarioAtual.uid), 
            where("data", "==", hoje)
        );
        const snapshot = await getDocs(q);
        let horaEntrada = "-";
        snapshot.forEach((doc) => {
            const r = doc.data();
            if (r.tipo && r.tipo.toLowerCase().trim() === "entrada") {
                horaEntrada = r.hora;
            }
        });
        return horaEntrada;
    } catch (e) {
        return "-";
    }
}

async function verificarBloqueios() {
    if (!usuarioAtual) return { jaTemEntrada: false, jaTemSaida: false };
    const hoje = new Date().toLocaleDateString('pt-PT');
    
    try {
        const q = query(
            collection(db, "registos"), 
            where("userId", "==", usuarioAtual.uid), 
            where("data", "==", hoje)
        );
        const snapshot = await getDocs(q);
        
        let jaTemEntrada = false;
        let jaTemSaida = false;

        snapshot.forEach((doc) => {
            const r = doc.data();
            const tipo = r.tipo ? r.tipo.toLowerCase().trim() : "";
            if (tipo === "entrada") jaTemEntrada = true;
            if (tipo === "saída" || tipo === "saida") jaTemSaida = true;
        });

        document.getElementById("btn-entrada").disabled = jaTemEntrada;
        document.getElementById("btn-saida").disabled = jaTemSaida;

        if (jaTemEntrada && jaTemSaida) {
            document.getElementById('record').innerHTML = "🔒 Já efetuou todos os registos permitidos para hoje.";
        } else if (jaTemEntrada) {
            document.getElementById('record').innerHTML = "✔ Entrada registada. Pendente de Saída.";
        } else {
            document.getElementById('record').innerHTML = "Nenhum registo efetuado hoje.";
        }
        
        return { jaTemEntrada, jaTemSaida };
    } catch (erro) {
        console.error("Erro ao verificar bloqueios:", erro);
        return { jaTemEntrada: false, jaTemSaida: false };
    }
}

async function registrar(tipo){
    if (!usuarioAtual) return;
    obterLocalizacao();
    
    document.getElementById('record').innerHTML = "⏳ A processar registo, aguarde...";

    setTimeout(async () => {
        const agora = new Date();
        const hora = agora.toLocaleTimeString('pt-PT');
        const data = agora.toLocaleDateString('pt-PT');

        if(!localizacaoTexto){
            document.getElementById('record').innerHTML = "❌ Não foi possível obter a localização. Tente novamente.";
            return;
        }

        const { jaTemEntrada, jaTemSaida } = await verificarBloqueios();
        
        if (tipo === "Entrada" && jaTemEntrada) {
            document.getElementById('record').innerHTML = "❌ Operação negada: Já existe uma Entrada hoje.";
            return;
        }
        if (tipo === "Saída" && jaTemSaida) {
            document.getElementById('record').innerHTML = "❌ Operação negada: Já existe uma Saída hoje.";
            return;
        }

        try {
            await addDoc(collection(db, "registos"), {
                userId: usuarioAtual.uid,
                userEmail: usuarioAtual.email,
                tipo: tipo,
                data: data,
                hora: hora,
                localizacao: localizacaoTexto,
                latitude: latitude,
                longitude: longitude,
                criadoEm: new Date()
            });

            if (tipo === "Saída") {
                const horaEntradaDoDia = await obterHoraEntradaDoDia();
                await enviarParaGoogleSheets({
                    userEmail: usuarioAtual.email,
                    data: data,
                    horaSaida: hora,
                    localizacao: localizacaoTexto,
                    horaEntradaDoDia: horaEntradaDoDia
                });
            }

            const horaExibida = arredondarHora(hora);
            document.getElementById('record').innerHTML = `
                <strong>${tipo}</strong> registada às ${horaExibida} (Arredondado)<br><br>
                📅 ${data}<br>
                📍 ${localizacaoTexto}
            `;
            
            await verificarBloqueios();

        } catch (erro) {
            console.error("Erro ao gravar o ponto:", erro);
            document.getElementById('record').innerHTML = "❌ Erro ao gravar o ponto.";
        }
    }, 1500);
}

window.registrar = registrar;
</script>
</body>
</html>
