<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCBAOQPsVWqCmZ2YfDwEMfzbHpc3z4ua9A",
        authDomain: "picagem-de-ponto-899d2.firebaseapp.com",
        projectId: "picagem-de-ponto-899d2",
        storageBucket: "picagem-de-ponto-899d2.firebasestorage.app",
        messagingSenderId: "235653631354",
        appId: "1:235653631354:web:c4909c8832b32cbea65ac3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let usuarioAtual = null;

    // --- NOVA FUNÇÃO DE SINCRONIZAÇÃO ---
    async function enviarParaGoogleSheets(dadosRegisto) {
        const urlScript = "https://script.google.com/macros/s/AKfycbxm_v93NQagNCp0rrExyXp5ytjiu-CovYcGxKEU0VI7ObV0fRKGDxWEXywlYYHNhlik/exec";
        
        const payload = {
            colaborador: dadosRegisto.userEmail ? dadosRegisto.userEmail.split('@')[0] : "Usuário",
            data: dadosRegisto.data,
            entrada: dadosRegisto.tipo === "Entrada" ? dadosRegisto.hora : "-",
            saida: dadosRegisto.tipo === "Saída" ? dadosRegisto.hora : "-",
            horasTrabalhadas: "-",
            localizacao: dadosRegisto.localizacao
        };

        try {
            await fetch(urlScript, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } catch (error) {
            console.error("Erro ao sincronizar com Sheets:", error);
        }
    }

    // (Mantenha o seu código de autenticação, relógio e obterLocalizacao aqui...)

    async function registrar(tipo){
        if (!usuarioAtual) return;
        obterLocalizacao();
        
        document.getElementById('record').innerHTML = "⏳ A processar registo, aguarde...";

        setTimeout(async () => {
            const agora = new Date();
            const hora = agora.toLocaleTimeString('pt-PT');
            const data = agora.toLocaleDateString('pt-PT');

            if(!localizacaoTexto){
                document.getElementById('record').innerHTML = "❌ Erro: Localização necessária.";
                return;
            }

            const dadosParaGravar = {
                userId: usuarioAtual.uid,
                userEmail: usuarioAtual.email,
                tipo: tipo,
                data: data,
                hora: hora,
                localizacao: localizacaoTexto,
                criadoEm: new Date()
            };

            try {
                // 1. Gravar no Firestore
                await addDoc(collection(db, "registos"), dadosParaGravar);

                // 2. Sincronizar com Sheets (Chamada da nova função)
                await enviarParaGoogleSheets(dadosParaGravar);

                document.getElementById('record').innerHTML = `✅ ${tipo} registada com sucesso!`;
                await verificarBloqueios();
            } catch (erro) {
                document.getElementById('record').innerHTML = "❌ Erro ao gravar.";
            }
        }, 1500);
    }

    window.registrar = registrar;
</script>
